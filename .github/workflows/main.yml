name: Update Cafeteria Menu

on:
  schedule:
    # KST 기준: 매주 일요일(0), 월요일(1) 오전 10시(UTC 1시) 및 오후 4시(UTC 7시)
    - cron: '0 1,7 * * 0,1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 부품(라이브러리) 설치하기
        run: pip install -r requirements.txt

      - name: 학식 가져오는 파이썬 코드 실행!
        run: python cafeteria.py

      - name: 생성된 JSON 파일 및 번역 사전을 깃허브에 저장(Commit & Push)하기
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add weekly_menu.json food_dict.json # 👈 커스텀 사전 파일도 함께 저장하도록 추가!
          git commit -m "Auto Update Weekly Menu Data" || echo "No changes to commit"
          git push
