name: Update Dormitory Notice

on:
  schedule:
    # KST 기준: 매일 오후 6시 (UTC 기준 오전 9시)
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치하기
        run: pip install -r requirements.txt

      - name: 공지사항 크롤러 실행!
        run: python notice_crawler.py

      - name: 생성된 notice.json을 깃허브에 저장(Commit & Push)하기
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add notice.json
          git commit -m "Auto Update Notice Data" || echo "No changes to commit"
          git push
